name: Daily Motivation

on:
  # Cron-планировщик переехал на личный сервер (10.05.2026):
  # GitHub Actions пропускал запуски и задерживал их на 4-5 часов.
  # Скрипт крутится из ~/morning-motivation/run.sh на cinderella@91.228.152.239
  # по системному cron в 05:00 UTC = 08:00 MSK.
  workflow_dispatch:
  repository_dispatch:
    types: [morning]

concurrency:
  group: daily-motivation
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python send.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
