name: Daily Motivation

on:
  schedule:
    - cron: '7 5 * * *'    # 08:07 MSK — основной запуск
    - cron: '17 5 * * *'   # 08:17 MSK — резерв на случай, если первый скипнулся
  workflow_dispatch:

concurrency:
  group: daily-motivation
  cancel-in-progress: false

permissions:
  contents: read
  contents: write
  issues: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python send.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}


          - name: Commit last_sent flag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_sent.txt
          git diff --cached --quiet || (git commit -m "update last_sent" && git push)
